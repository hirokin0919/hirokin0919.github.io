baseURL: "https://hirokin0919.github.io/"
title: "Hiroki's website"
theme: "PaperMod"
hasCJKLanguage: true
defaultContentLanguage: "ja"
enableRobotsTXT: true

params:
  defaultTheme: "auto"
  disableThemeToggle: false
  showLanguageSelector: true
  assets:
    favicon: "/favicon.ico"
    favicon16x16: "/favicon-16x16.png"
    favicon32x32: "/favicon-32x32.png"
    apple_touch_icon: "/apple-touch-icon.png"

languages:
  ja:
    languageCode: "ja"
    languageName: "日本語"
    weight: 2
    contentDir: "content/ja"
    params:
      profileMode:
        enabled: true
        title: "武田 博樹"
        subtitle: |
          大阪大学大学院情報科学研究科  
          情報基礎数学専攻
          博士前期課程2年 (M2) 
        imageUrl: "/images/profile.jpg"
        imageTitle: "myProfile"
      socialIcons:
        - name: "email"
          url: "mailto:u303995c@ecs.osaka-u.ac.jp"
        - name: "github"
          url: "https://github.com/hirokin0919"
    menu:
      main:
        - identifier: "about"
          name: "About"
          url: "/about/"
        - identifier: "cv"
          name: "CV"
          url: "/cv/"
        - identifier: "publications"
          name: "Publications"
          url: "/publications/"
  en:
    languageCode: "en"
    languageName: "English"
    weight: 1
    contentDir: "content/en"
    params:
      profileMode:
        enabled: true
        title: "Hiroki Takeda"
        subtitle: |
          Master's Students (M2)  
          Dept. of Pure and Applied Mathematics  
          Graduate School of Information Science and Technology, Osaka University
        imageUrl: "/images/profile.jpg"
        imageTitle: "myProfile"
      socialIcons:
        - name: "email"
          url: "mailto:u303995c@ecs.osaka-u.ac.jp"
        - name: "github"
          url: "https://github.com/hirokin0919"
    menu:
      main:
        - identifier: "about"
          name: "About"
          url: "/about/"
        - identifier: "cv"
          name: "CV"
          url: "/cv/"
        - identifier: "publications"
          name: "Publications"
          url: "/publications/"

